<!doctype html>
<html lang="en" style="height: 100%; margin: 0; padding: 0;">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>Portfolio Access</title>
    <style>
      /* --- PRELOADER STYLES --- */
      #preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #F5F5F5; /* Matches your body background */
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }

      /* Custom scrollbar to keep the clean aesthetic if content overflows the 60vh height */
      .scroll-container::-webkit-scrollbar {
        width: 6px;
      }
      .scroll-container::-webkit-scrollbar-track {
        background: transparent;
      }
      .scroll-container::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.1);
        border-radius: 10px;
      }
      
      /* Elegant placeholder styling for the password input */
      .elegant-input::placeholder {
        color: #A3A3A3;
        font-weight: 400;
      }
      .elegant-input:focus {
        outline: none;
        border-color: #FF0000 !important;
        box-shadow: 0px 5px 15px rgba(255, 0, 0, 0.1);
      }

      /* Red Hover Effect for Buttons */
      .elegant-btn {
        background-color: #000000 !important;
        transition: all 0.25s ease-in-out !important;
      }
      .elegant-btn:hover {
        background-color: #FF0000 !important;
        box-shadow: 0px 10px 20px rgba(255, 0, 0, 0.40) !important;
      }
    </style>
  </head>

    <script>
      window.addEventListener('load', function() {
        var preloader = document.getElementById('preloader');
        preloader.style.opacity = '0';
        setTimeout(function() {
          preloader.style.visibility = 'hidden';
        }, 500); // Smoothly drops visibility off canvas right after fade transition
      });
